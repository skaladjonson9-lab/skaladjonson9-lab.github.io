  <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvaYosevna // Персональная страница</title>
    <style>
        html, body, a, button, .winamp-btn, .facts-toggle-btn, .webring-btn {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='32' height='32' style='font-size:24px'><text y='24'>💿</text></svg>"), auto;
        }
        a:hover, button:hover, .winamp-btn:hover, .facts-toggle-btn:hover, .webring-btn:hover, .gallery-btn:hover, [onclick]:hover {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='32' height='32' style='font-size:24px'><text y='24'>👆</text></svg>"), pointer !important;
        }
        body { 
            font-family: "Courier New", Courier, monospace; 
            margin: 0; padding: 0; 
            background-color: #3b6ea5; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("windows.gif") #3b6ea5; 
            background-repeat: no-repeat; background-size: cover; background-position: center; background-attachment: fixed; image-rendering: pixelated; 
            color: #000000; overflow-x: hidden; 
        }
        .main-content { max-width: 700px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; box-sizing: border-box; }
        .fish-aquarium { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .fish { position: absolute; font-size: 55px; animation: swim linear infinite; }
        .fish-1 { top: 25%; animation-duration: 18s; animation-delay: 0s; }
        .fish-2 { top: 55%; font-size: 45px; animation-duration: 25s; animation-delay: -5s; }
        .fish-3 { top: 85%; font-size: 35px; animation-duration: 14s; animation-delay: -2s; }
        @keyframes swim { 0% { left: -120px; transform: scaleX(-1); } 100% { left: calc(100% + 120px); transform: scaleX(-1); } }
        .bubble-container { position: fixed; bottom: -40px; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .bubble { position: absolute; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 50%; bottom: -40px; animation: floatUp linear infinite; box-shadow: inset -3px -3px 6px rgba(255,255,255,0.2); }
        .b1 { left: 8%; width: 24px; height: 24px; animation-duration: 7s; animation-delay: 0s; }
        .b2 { left: 28%; width: 16px; height: 16px; animation-duration: 10s; animation-delay: 2s; }
        .b3 { left: 52%; width: 32px; height: 32px; animation-duration: 8s; animation-delay: 1s; }
        .b4 { left: 78%; width: 14px; height: 14px; animation-duration: 12s; animation-delay: 3s; }
        .b5 { left: 88%; width: 22px; height: 22px; animation-duration: 6s; animation-delay: 1.5s; }
        @keyframes floatUp { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-115vh) translateX(40px); opacity: 0; } }
        .winamp-player { background: #222; border: 2px solid #444; border-radius: 4px; padding: 10px; margin-top: 15px; color: #00ff00; font-family: monospace; box-shadow: inset 2px 2px 5px #000; }
        .winamp-title { font-size: 0.8em; color: #888; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .winamp-display { background: #000; padding: 6px; border: 1px solid #333; font-size: 0.85em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-radius: 2px; box-shadow: inset 0 0 4px #00ff00; display: flex; justify-content: space-between; }
        .winamp-controls { display: flex; gap: 8px; margin-top: 8px; font-size: 0.75em; }
        .winamp-btn { background: #333; color: #fff; padding: 2px 8px; border: 1px solid #555; text-transform: uppercase; font-weight: bold; border-radius: 2px; user-select: none; }
        .winamp-btn:active { background: #111; }
        .eq-bar { display: inline-block; width: 3px; background: #00ff00; margin-left: 1px; height: 10px; vertical-align: bottom; }
        .playing .eq-1 { animation: eq 0.4s ease-in-out infinite alternate; }
        .playing .eq-2 { animation: eq 0.6s ease-in-out infinite alternate; }
        .playing .eq-3 { animation: eq 0.5s ease-in-out infinite alternate; }
        @keyframes eq { 0% { height: 2px; } 100% { height: 14px; } }
        .window { background: #d4d0c8; border: 3px solid; border-color: #fff #808080 #808080 #fff; padding: 15px; box-shadow: 5px 5px 0px rgba(0,0,0,0.3); margin-bottom: 25px; }
        .window-title { background: linear-gradient(90deg, #000080, #1084d0); color: white; padding: 4px 8px; font-weight: bold; font-size: 0.9em; margin: -15px -15px 15px -15px; display: flex; justify-content: space-between; }
        .profile { display: flex; align-items: center; gap: 20px; background: #e8e7e3; padding: 15px; border: 2px inset #fff; }
        .avatar { width: 75px; height: 75px; border: 2px solid #000; image-rendering: pixelated; }
        .profile-text h1 { font-size: 1.6em; margin: 0 0 5px 0; font-family: sans-serif; font-weight: bold; color: #000; }
        .profile-text p { margin: 0; font-size: 0.9em; color: #222; }
        .sticker-badge { background: #d4d0c8; border: 1px solid; border-color: #fff #808080 #808080 #fff; padding: 2px 6px; font-size: 0.8em; font-weight: bold; display: flex; align-items: center; gap: 4px; box-shadow: 1px 1px 0px rgba(0,0,0,0.3); }
        .facts-toggle-btn { background: #d4d0c8; border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 6px 12px; font-size: 0.85em; font-weight: bold; font-family: sans-serif; margin-top: 15px; box-shadow: 2px 2px 0px rgba(0,0,0,0.4); display: inline-block; user-select: none; }
        .facts-toggle-btn:active { border-color: #808080 #fff #fff #808080; padding: 7px 11px 5px 13px; box-shadow: none; }
        .gallery-box { background: #e8e7e3; border: 2px inset #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 5px; }
        .gallery-screen { width: 100%; max-width: 400px; height: 250px; background: #000; border: 2px inset #fff; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .gallery-img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .gallery-img.active { display: block; }
        .gallery-controls { display: flex; gap: 15px; width: 100%; justify-content: center; }
        .gallery-btn { background: #d4d0c8; border: 2px solid; border-color: #fff #808080 #808080 #fff; color: #000; padding: 4px 15px; font-weight: bold; font-size: 0.85em; user-select: none; }
        .gallery-btn:active { border-color: #808080 #fff #fff #808080; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        .modal-window { background: #d4d0c8; border: 3px solid; border-color: #fff #808080 #808080 #fff; width: 100%; max-width: 550px; box-shadow: 10px 10px 0px rgba(0,0,0,0.4); z-index: 1000; box-sizing: border-box; }
        .modal-body { background: #e8e7e3; border: 2px inset #fff; margin: 15px; padding: 15px; height: 350px; overflow-y: scroll; font-size: 0.9em; line-height: 1.5; color: #000; }
        .modal-body ul { padding-left: 20px; margin-top: 5px; }
        .modal-body li { margin-bottom: 12px; }
        .feed-title { color: #fff; background: #000080; padding: 6px 10px; border: 2px inset #fff; display: inline-block; margin-top: 30px; margin-bottom: 10px; font-size: 1.4em; text-transform: uppercase; }
        .post { background: #e8e7e3; padding: 15px; border: 2px inset #fff; margin-bottom: 20px; box-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
        .post-date { font-size: 0.85em; color: #444; font-weight: bold; border-bottom: 1px dashed #bbb; padding-bottom: 5px; margin-bottom: 10px; }
        .post h3 { margin: 0 0 8px 0; color: #000080; }
        .blink-footer { text-align: center; margin-top: 40px; padding-top: 15px; border-top: 2px double #fff; }
        .webring-panel { background: #d4d0c8; border: 2px solid; border-color: #fff #808080 #808080 #fff; max-width: 450px; margin: 20px auto 0 auto; padding: 10px; box-shadow: 3px 3px 0px rgba(0,0,0,0.3); font-size: 0.85em; }
        .webring-title { font-weight: bold; color: #000080; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .webring-controls { display: flex; justify-content: center; gap: 10px; align-items: center; margin-top: 8px; }
        .webring-btn { background: #d4d0c8; border: 2px solid; border-color: #fff #808080 #808080 #fff; color: #000; padding: 2px 8px; text-decoration: none; font-weight: bold; font-size: 0.8em; }
        .webring-btn:active { border-color: #808080 #fff #fff #808080; }
        .blink-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .blink-btn { display: inline-block; width: 100px; height: 31px; line-height: 31px; background: #000; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; text-align: center; border: 2px solid; border-color: #fff #555 #555 #fff; text-transform: uppercase; font-family: sans-serif; }
        .blink-btn.tg { background: #0088cc; }
        .blink-btn.gh { background: #24292e; }
    </style>
</head>
